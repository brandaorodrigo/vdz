<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="48x48">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/site.webmanifest" rel="manifest">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body class="host">
    <main>
        <video autoplay hidden id="preview" muted playsinline></video>
        <div class="picker" hidden id="picker">
            <div id="picker-list"></div>
        </div>
        <div class="row settings" id="capture-settings">
            <input aria-label="Nome da transmissão" autocapitalize="off" autocomplete="off" id="room-name"
                maxlength="10" placeholder="Nome da transmissão" spellcheck="false" type="text">
            <button aria-label="Criar transmissão" class="icon-btn" data-tooltip="Criar transmissão" id="create"
                type="button">
                <span aria-hidden="true" class="icon">cast</span>
            </button>
        </div>
        <div class="row">
            <select aria-label="Resolução" hidden id="resolution">
                <option value="480">480p</option>
                <option value="720">720p</option>
                <option selected value="1080">1080p</option>
            </select>
            <select aria-label="Quadros por segundo" hidden id="fps">
                <option value="30">30 fps</option>
                <option selected value="60">60 fps</option>
            </select>
            <button aria-label="Selecionar janela para transmitir" class="icon-btn"
                data-tooltip="Selecionar janela para transmitir" hidden id="share" type="button">
                <span aria-hidden="true" class="icon">cast</span>
            </button>
            <button aria-label="Encerrar transmissão" class="icon-btn end" data-tooltip="Encerrar transmissão" hidden
                id="stop" type="button">
                <span aria-hidden="true" class="icon">close</span>
            </button>
        </div>
    </main>
    <a aria-label="Voltar" class="icon-btn stream-back" data-tooltip="Voltar" href="/" target="_top"><span
            aria-hidden="true" class="icon">arrow_back</span></a>
    <div class="status-message" hidden id="status" role="status"></div>
    <script src="/host.js"></script>
</body>

</html>
