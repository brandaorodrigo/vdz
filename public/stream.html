<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="48x48">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/site.webmanifest" rel="manifest">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body class="stream">
    <main>
        <table class="lives">
            <thead>
                <tr>
                    <th>Transmissões</th>
                </tr>
            </thead>
            <tbody id="lives">
                <tr>
                    <td class="empty">Nenhuma transmissão no momento</td>
                </tr>
            </tbody>
        </table>
    </main>
    <a aria-label="Voltar" class="icon-btn stream-back" data-tooltip="Voltar" href="/" target="_top"><span
            aria-hidden="true" class="icon">arrow_back</span></a>
    <script>
        const livesBody = document.getElementById('lives');

        function renderLives(names) {
            livesBody.replaceChildren();
            if (names.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.className = 'empty';
                cell.textContent = 'Nenhuma transmissão no momento';
                row.append(cell);
                livesBody.append(row);
                return;
            }
            for (const name of names) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                const link = document.createElement('a');
                link.href = `/${encodeURIComponent(name)}`;
                link.textContent = name;
                cell.append(link);
                row.append(cell);
                livesBody.append(row);
            }
        }

        async function loadLives() {
            try {
                const response = await fetch('/api/rooms', { cache: 'no-store' });
                if (!response.ok) {
                    return;
                }
                const data = await response.json();
                if (!data || !Array.isArray(data.rooms)) {
                    return;
                }
                renderLives(data.rooms.filter((name) => typeof name === 'string'));
            } catch {
                // Mantém a lista que já está na tela.
            }
        }

        loadLives();
        setInterval(loadLives, 5000);

        if (window.parent !== window) {
            let lastNotice = 0;
            const notice = () => {
                const now = Date.now();
                if (now - lastNotice < 150) {
                    return;
                }
                lastNotice = now;
                window.parent.postMessage({ source: 'vdz-watch', type: 'pointer' }, location.origin);
            };
            document.addEventListener('pointermove', notice);
            document.addEventListener('pointerdown', notice);
        }
    </script>
</body>

</html>
