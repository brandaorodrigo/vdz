<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="any">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/styles.css" rel="stylesheet">
</head>

<body>
    <div class="idle" id="stage">
        <video autoplay hidden id="view"></video>
    </div>
    <script>
        // Assistir é só no navegador. O app Electron é mandado para a página de atualização.
        if (navigator.userAgent.includes('Electron')) {
            location.replace('/update');
            throw new Error('update');
        }

        const stage = document.getElementById('stage');
        const video = document.getElementById('view');
        // Qual transmissão assistir, vinda de /play?id=...
        const broadcasterId = Number(new URLSearchParams(location.search).get('id'));

        // Começa mudo para o autoplay ser aceito. O controle do <video> libera o som.
        video.muted = true;

        // Servidores STUN usados para descobrir o endereço público na conexão WebRTC.
        const iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
        ];
        // Candidatos ICE que chegaram antes da oferta SDP do transmissor.
        const pending = [];
        // A única conexão desta página, com o transmissor escolhido.
        let pc = null;

        // Sinalização com o server.js, na mesma origem da página.
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

        // Ping a cada 5 minutos para o servidor não dormir por inatividade.
        const ping = () => fetch('/ping').catch(() => { });
        ping();
        setInterval(ping, 5 * 60 * 1000);

        // Solta o vídeo e deixa a tela vazia, sem o player.
        function showIdle() {
            stage.classList.add('idle');
            video.controls = false;
            video.hidden = true;
            video.srcObject = null;
        }

        // Fecha a conexão e esvazia a fila de candidatos.
        function drop() {
            pending.length = 0;
            if (pc) {
                pc.close();
                pc = null;
            }
            showIdle();
        }

        // Abre (ou reabre) a conexão que vai receber o vídeo e o áudio.
        function connect() {
            if (pc) {
                pc.close();
            }
            const conn = new RTCPeerConnection({ iceServers });
            pc = conn;
            // A faixa recebida entra no <video> e mostra o player.
            conn.ontrack = (e) => {
                if (video.srcObject !== e.streams[0]) {
                    video.srcObject = e.streams[0];
                }
                stage.classList.remove('idle');
                video.hidden = false;
                video.controls = true;
                video.play().catch(() => { });
            };
            // Cada candidato ICE encontrado volta ao transmissor pelo servidor.
            conn.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === 1) {
                    ws.send(JSON.stringify({ candidate: e.candidate, id: broadcasterId, type: 'candidate' }));
                }
            };
            return conn;
        }

        // Trata uma mensagem de sinalização vinda do servidor.
        async function handle(msg) {
            // A transmissão não existe ou acabou de encerrar.
            if (msg.type === 'gone' || msg.type === 'stop') {
                drop();
                return;
            }
            // Oferta SDP do transmissor. Ignora se for de outra live.
            if (msg.type === 'offer') {
                if (msg.id !== broadcasterId) {
                    return;
                }
                const early = pending.splice(0);
                const conn = connect();
                await conn.setRemoteDescription(msg.sdp);
                const answer = await conn.createAnswer();
                await conn.setLocalDescription(answer);
                ws.send(JSON.stringify({ id: broadcasterId, sdp: conn.localDescription, type: 'answer' }));
                // Candidatos que chegaram antes da oferta entram agora.
                for (const c of early) {
                    await conn.addIceCandidate(c);
                }
                return;
            }
            // Candidato ICE do transmissor. Sem a oferta ainda, fica na fila.
            if (msg.type === 'candidate') {
                if (msg.id !== broadcasterId) {
                    return;
                }
                if (pc?.remoteDescription) {
                    await pc.addIceCandidate(msg.candidate);
                } else {
                    pending.push(msg.candidate);
                }
            }
        }

        // Mensagens do socket são processadas uma depois da outra.
        let chain = Promise.resolve();
        // Ao conectar, pede para assistir o id da URL. Sem id, a página fica na tela vazia.
        ws.onopen = () => {
            if (!broadcasterId) {
                return;
            }
            ws.send(JSON.stringify({ id: broadcasterId, type: 'watcher' }));
        };
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            chain = chain.then(() => handle(msg)).catch((err) => console.error(err));
        };
    </script>
</body>

</html>
