<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="any">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/site.webmanifest" rel="manifest">
    <link href="/styles.css" rel="stylesheet">
</head>

<body>
    <main class="stream">
        <img alt="vdz" height="70" src="/vdz.png">
        <div class="pair">
            <select id="res">
                <!--<option value="1920x1080">1080p</option>-->
                <option value="1280x720">720p</option>
                <option value="854x480">480p</option>
            </select>
            <select id="fps">
                <option value="60">60fps</option>
                <option value="30">30fps</option>
            </select>
        </div>
        <select hidden id="win"></select>
        <div id="preview">
            <video aria-label="Prévia da transmissão" autoplay muted playsinline></video>
        </div>
        <button id="go" type="button"><img alt="Transmitir" src="/stream.png" width="25"></button>
        <span id="note"></span>
    </main>
    <script>
        const pcs = new Map();
        const ice = new Map();
        let stream = null;
        let width = 1280;
        let height = 720;
        let fps = 30;

        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

        function send(msg) {
            const data = JSON.stringify(msg);
            if (ws.readyState === 1) {
                ws.send(data);
            } else {
                ws.addEventListener('open', () => ws.send(data), { once: true });
            }
        }

        function targetBitrate() {
            const pixels = width * height;
            const hd = pixels >= 1920 * 1080;
            const sd = pixels >= 1280 * 720;
            if (fps >= 50) {
                if (hd) {
                    return 8_000_000;
                }
                if (sd) {
                    return 4_500_000;
                }
                return 2_000_000;
            }
            if (hd) {
                return 5_000_000;
            }
            if (sd) {
                return 2_500_000;
            }
            return 1_200_000;
        }

        async function setSender(sender) {
            const params = sender.getParameters();
            if (!params.encodings?.length) {
                params.encodings = [{}];
            }
            const settings = sender.track.getSettings();
            const scale = Math.max(settings.width ? settings.width / width : 1, settings.height ? settings.height / height : 1, 1);
            const bitrate = targetBitrate();
            params.encodings[0].minBitrate = bitrate;
            params.encodings[0].maxBitrate = bitrate;
            params.encodings[0].maxFramerate = fps;
            params.encodings[0].scaleResolutionDownBy = scale;
            await sender.setParameters(params);
        }

        function readQuality() {
            const size = document.getElementById('res').value.split('x');
            width = Number(size[0]);
            height = Number(size[1]);
            fps = Number(document.getElementById('fps').value);
        }

        async function pushQuality() {
            if (!stream) {
                return;
            }
            const track = stream.getVideoTracks()[0];
            if (track) {
                try {
                    await track.applyConstraints({
                        frameRate: { ideal: fps, max: fps },
                        height: { ideal: height, max: height },
                        width: { ideal: width, max: width },
                    });
                } catch { }
            }
            if (!stream) {
                return;
            }
            for (const pc of pcs.values()) {
                for (const sender of pc.getSenders()) {
                    if (sender.track?.kind !== 'video') {
                        continue;
                    }
                    try {
                        await setSender(sender);
                    } catch (err) {
                        console.error(err);
                    }
                }
            }
        }

        let qualityChain = Promise.resolve();
        function onQualityChange() {
            readQuality();
            qualityChain = qualityChain.then(() => pushQuality()).catch((err) => console.error(err));
        }

        async function connectViewer(id) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pcs.set(id, pc);
            ice.set(id, []);
            const sender = pc.addTrack(stream.getVideoTracks()[0], stream);
            const audio = stream.getAudioTracks()[0];
            if (audio) {
                pc.addTrack(audio, stream);
            }
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    send({ candidate: e.candidate, id, type: 'candidate' });
                }
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            try {
                await setSender(sender);
            } catch (err) {
                console.error(err);
            }
            send({ id, sdp: pc.localDescription, type: 'offer' });
        }

        async function handle(msg) {
            if (msg.type === 'full') {
                stop();
                document.getElementById('note').textContent = 'limite de 4';
                return;
            }
            if (msg.type === 'watcher' && stream) {
                await connectViewer(msg.id);
                return;
            }
            if (msg.type === 'answer') {
                const pc = pcs.get(msg.id);
                if (!pc) {
                    return;
                }
                await pc.setRemoteDescription(msg.sdp);
                for (const c of ice.get(msg.id) || []) {
                    await pc.addIceCandidate(c);
                }
                ice.set(msg.id, []);
                return;
            }
            if (msg.type === 'candidate') {
                const pc = pcs.get(msg.id);
                if (!pc?.remoteDescription) {
                    if (!ice.has(msg.id)) {
                        ice.set(msg.id, []);
                    }
                    ice.get(msg.id).push(msg.candidate);
                    return;
                }
                await pc.addIceCandidate(msg.candidate);
                return;
            }
            if (msg.type === 'watcher-gone') {
                const pc = pcs.get(msg.id);
                if (pc) {
                    pc.close();
                }
                pcs.delete(msg.id);
                ice.delete(msg.id);
            }
        }

        let chain = Promise.resolve();
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            chain = chain.then(() => handle(msg)).catch((err) => console.error(err));
        };

        const go = document.getElementById('go');
        const preview = document.getElementById('preview');
        const previewVideo = preview.querySelector('video');
        let starting = false;
        let audioPump = null;

        function showPreview() {
            previewVideo.srcObject = stream;
            preview.classList.add('on');
            previewVideo.play().catch(() => { });
        }

        function hidePreview() {
            preview.classList.remove('on');
            previewVideo.pause();
            previewVideo.srcObject = null;
        }

        function releaseAudio() {
            if (!audioPump) {
                return;
            }
            const release = audioPump;
            audioPump = null;
            release();
        }

        function asFloat(samples) {
            if (samples instanceof Float32Array) {
                return samples;
            }
            return Float32Array.from(samples);
        }

        async function startWindowAudio() {
            const chunks = [];
            let offset = 0;
            let channels = 2;
            window.vdz.onAudio((payload) => {
                channels = payload.channels || channels;
                chunks.push(asFloat(payload.samples));
                let total = 0;
                for (const item of chunks) {
                    total += item.length;
                }
                while (chunks.length > 1 && total > 48000 * channels) {
                    total -= chunks[0].length;
                    chunks.shift();
                    offset = 0;
                }
            });
            const meta = await window.vdz.startAudio();
            if (!meta) {
                window.vdz.offAudio();
                throw new Error('audio');
            }
            const ctx = new AudioContext({ sampleRate: meta.sampleRate || 48000 });
            await ctx.resume();
            const dest = ctx.createMediaStreamDestination();
            const node = ctx.createScriptProcessor(4096, 0, 2);
            const mute = ctx.createGain();
            mute.gain.value = 0;
            node.onaudioprocess = (ev) => {
                const left = ev.outputBuffer.getChannelData(0);
                const right = ev.outputBuffer.getChannelData(1);
                for (let i = 0; i < left.length; i++) {
                    if (!chunks.length || offset >= chunks[0].length) {
                        if (chunks.length) {
                            chunks.shift();
                            offset = 0;
                        }
                        if (!chunks.length) {
                            left[i] = 0;
                            right[i] = 0;
                            continue;
                        }
                    }
                    const data = chunks[0];
                    if (channels < 2) {
                        const sample = data[offset++];
                        left[i] = sample;
                        right[i] = sample;
                        continue;
                    }
                    if (offset + 1 >= data.length) {
                        chunks.shift();
                        offset = 0;
                        i -= 1;
                        continue;
                    }
                    left[i] = data[offset++];
                    right[i] = data[offset++];
                }
            };
            node.connect(dest);
            node.connect(mute);
            mute.connect(ctx.destination);
            return {
                stop() {
                    window.vdz.offAudio();
                    window.vdz.stopAudio();
                    node.disconnect();
                    mute.disconnect();
                    ctx.close();
                },
                stream: dest.stream,
            };
        }

        async function capture() {
            if (!window.vdz) {
                return navigator.mediaDevices.getDisplayMedia({
                    audio: true,
                    video: { frameRate: { ideal: fps, max: fps }, height: { ideal: height }, width: { ideal: width } },
                });
            }
            const id = document.getElementById('win').value;
            if (!id) {
                throw new Error('janela');
            }
            const picked = await window.vdz.choose(id);
            if (!picked) {
                throw new Error('janela');
            }
            const videoStream = await navigator.mediaDevices.getDisplayMedia({ audio: false, video: true });
            try {
                const extra = await startWindowAudio();
                audioPump = () => extra.stop();
                return new MediaStream([...videoStream.getVideoTracks(), ...extra.stream.getAudioTracks()]);
            } catch (err) {
                releaseAudio();
                for (const track of videoStream.getTracks()) {
                    track.stop();
                }
                throw err;
            }
        }

        function stop() {
            hidePreview();
            releaseAudio();
            if (!stream) {
                return;
            }
            const current = stream;
            stream = null;
            for (const track of current.getTracks()) {
                track.onended = null;
                track.stop();
            }
            for (const pc of pcs.values()) {
                pc.close();
            }
            pcs.clear();
            ice.clear();
            go.classList.remove('stop');
            send({ type: 'stop' });
        }

        go.onclick = async () => {
            if (stream) {
                stop();
                return;
            }
            if (starting) {
                return;
            }
            starting = true;
            document.getElementById('note').textContent = '';
            readQuality();
            try {
                stream = await capture();
            } catch (err) {
                if (err?.message === 'janela') {
                    document.getElementById('note').textContent = 'escolha a janela';
                } else if (err?.message === 'audio') {
                    document.getElementById('note').textContent = 'sem áudio da janela';
                }
                return;
            } finally {
                starting = false;
            }
            const track = stream.getVideoTracks()[0];
            track.onended = () => stop();
            showPreview();
            qualityChain = qualityChain.then(() => pushQuality()).catch((err) => console.error(err));
            await qualityChain;
            if (!stream) {
                return;
            }
            go.classList.add('stop');
            send({ type: 'broadcaster' });
        };

        document.getElementById('res').addEventListener('change', onQualityChange);
        document.getElementById('fps').addEventListener('change', onQualityChange);

        const winSelect = document.getElementById('win');
        if (window.vdz) {
            const refresh = () => {
                const current = winSelect.value;
                window.vdz
                    .windows()
                    .then((list) => {
                        winSelect.replaceChildren();
                        const blank = document.createElement('option');
                        blank.value = '';
                        blank.textContent = 'janela';
                        winSelect.append(blank);
                        for (const item of list) {
                            const option = document.createElement('option');
                            option.value = item.id;
                            option.textContent = item.name;
                            winSelect.append(option);
                        }
                        if ([...winSelect.options].some((option) => option.value === current)) {
                            winSelect.value = current;
                        }
                        winSelect.hidden = false;
                    })
                    .catch((err) => console.error(err));
            };
            winSelect.addEventListener('focus', refresh);
            refresh();
        }
    </script>
</body>

</html>
