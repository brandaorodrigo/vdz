<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="48x48">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/site.webmanifest" rel="manifest">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body class="mosaic-page">
    <div class="mosaic" id="mosaic"></div>
    <nav aria-label="Mosaico" class="top-menu" id="top-menu">
        <div aria-hidden="true" class="top-menu-sensor"></div>
        <div class="top-menu-bar">
            <button aria-label="Remover transmissão" class="icon-btn" data-tooltip="Remover transmissão" id="fewer"
                type="button">
                <span aria-hidden="true" class="icon">remove</span>
            </button>
            <button aria-label="Adicionar transmissão" class="icon-btn" data-tooltip="Adicionar transmissão" id="more"
                type="button">
                <span aria-hidden="true" class="icon">add</span>
            </button>
            <button aria-label="Tela inteira" class="icon-btn" data-tooltip="Tela inteira" id="fullscreen"
                type="button">
                <span aria-hidden="true" class="icon">fullscreen</span>
            </button>
        </div>
    </nav>
    <script>
        const count = Number(location.pathname.slice(1));
        if (count < 1 || count > 4) {
            throw new Error('mosaico inválido');
        }

        const mosaic = document.getElementById('mosaic');
        const fewerBtn = document.getElementById('fewer');
        const moreBtn = document.getElementById('more');
        const fullscreenBtn = document.getElementById('fullscreen');
        const fullscreenIcon = fullscreenBtn.querySelector('.icon');

        mosaic.className = `mosaic count-${count}`;
        for (let index = 0; index < count; index += 1) {
            const frame = document.createElement('iframe');
            frame.src = '/watch';
            frame.title = `Transmissão ${index + 1}`;
            frame.allow = 'autoplay; fullscreen';
            mosaic.append(frame);
        }

        fewerBtn.setAttribute('aria-disabled', count <= 1 ? 'true' : 'false');
        moreBtn.setAttribute('aria-disabled', count >= 4 ? 'true' : 'false');

        fewerBtn.addEventListener('click', () => {
            if (count > 1) {
                location.assign(`/${count - 1}`);
            }
        });

        moreBtn.addEventListener('click', () => {
            if (count < 4) {
                location.assign(`/${count + 1}`);
            }
        });

        function renderFullscreen() {
            const active = document.fullscreenElement != null;
            fullscreenIcon.textContent = active ? 'fullscreen_exit' : 'fullscreen';
            fullscreenBtn.setAttribute('aria-label', active ? 'Sair da tela inteira' : 'Tela inteira');
        }

        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => { });
                return;
            }
            document.documentElement.requestFullscreen().catch(() => { });
        });

        document.addEventListener('fullscreenchange', renderFullscreen);

        const topMenu = document.getElementById('top-menu');
        const MENU_HIDE_MS = 2000;
        let menuTimer = null;
        let menuPointerDown = false;

        function showTopMenu() {
            topMenu.classList.add('shown');
            if (menuTimer) {
                clearTimeout(menuTimer);
            }
            menuTimer = null;
            if (menuPointerDown || topMenu.matches(':focus-within')) {
                return;
            }
            menuTimer = setTimeout(() => {
                menuTimer = null;
                if (menuPointerDown || topMenu.matches(':focus-within')) {
                    return;
                }
                topMenu.classList.remove('shown');
            }, MENU_HIDE_MS);
        }

        document.addEventListener('pointermove', showTopMenu);
        document.addEventListener('pointerdown', () => {
            menuPointerDown = true;
            showTopMenu();
        });
        document.addEventListener('pointerup', () => {
            menuPointerDown = false;
            showTopMenu();
        });
        document.addEventListener('pointercancel', () => {
            menuPointerDown = false;
            showTopMenu();
        });
        topMenu.addEventListener('focusin', showTopMenu);
        topMenu.addEventListener('focusout', () => {
            setTimeout(showTopMenu, 0);
        });
        window.addEventListener('message', (event) => {
            if (event.origin !== location.origin) {
                return;
            }
            const data = event.data;
            if (!data || data.source !== 'vdz-watch' || data.type !== 'pointer') {
                return;
            }
            showTopMenu();
        });
    </script>
</body>

</html>
