<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>vdz</title>
    <link href="/favicon.ico" rel="icon" sizes="any">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/styles.css" rel="stylesheet">
</head>

<body>
    <main>
        <img alt="vdz" id="vdz" src="/vdz.png">
        <table>
            <tr>
                <td colspan="3">
                    <input autocomplete="off" id="name" maxlength="40" placeholder="Nome da transmissão" type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <select id="res">
                        <option value="1920x1080">1080p</option>
                        <option selected value="1280x720">720p</option>
                        <option value="854x480">480p</option>
                    </select>
                </td>
                <td class="side">
                    <select id="fps">
                        <option selected value="60">60 fps</option>
                        <option value="30">30 fps</option>
                    </select>
                </td>
                <td>
                    <select id="rate">
                        <option value="2000000">2 Mb</option>
                        <option selected value="4000000">4 Mb</option>
                        <option value="8000000">8 Mb</option>
                        <option value="16000000">16 Mb</option>
                    </select>
                </td>
            </tr>
            <tr hidden id="win-row">
                <td colspan="3">
                    <select id="win"></select>
                </td>
            </tr>
        </table>
        <video aria-label="Prévia da transmissão" autoplay id="preview" muted playsinline></video>
        <button id="go" type="button"><img alt="Transmitir" src="/stream.png"></button>
    </main>
    <div id="error"></div>
    <script>
        // No app Electron, só a versão segue nesta página. Outra versão vai para /update.
        if (navigator.userAgent.includes('Electron')) {
            queryString = new URLSearchParams(window.location.search);
            const version = queryString.get('version');
            if (version !== '2.2.0') {
                location.replace('/update');
                throw new Error('update');
            }
        }

        // Servidores STUN usados para descobrir o endereço público na conexão WebRTC.
        const iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
        ];
        // Uma RTCPeerConnection por espectador.
        const pcs = new Map();
        // Candidatos ICE que chegaram antes da resposta SDP daquele espectador.
        const ice = new Map();
        // Mídia capturada (vídeo da tela e, se houver, áudio).
        let stream = null;
        // Qualidade pedida nos selects. Lida de novo antes de capturar e a cada mudança.
        let width = 1280;
        let height = 720;
        let fps = 30;
        let bitrate = 4_000_000;

        // Sinalização com o server.js, na mesma origem da página.
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

        // Mostra uma mensagem de erro na tela e esconde depois de 5 segundos.
        let errorTimer = 0;
        function showError(message) {
            const el = document.getElementById('error');
            el.textContent = typeof message === 'string' ? message : JSON.stringify(message);
            el.style.display = 'block';
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                el.textContent = '';
                el.style.display = 'none';
            }, 5000);
        }

        // Enquanto transmite, chama /ping a cada 5 minutos para o servidor não dormir por inatividade.
        let awake = 0;
        function stayAwake(on) {
            clearInterval(awake);
            awake = 0;
            if (!on) {
                return;
            }
            const ping = () => fetch('/ping').catch(() => { });
            ping();
            awake = setInterval(ping, 5 * 60 * 1000);
        }

        // Envia JSON ao servidor. Se o socket ainda não abriu, espera o evento open.
        function send(msg) {
            const data = JSON.stringify(msg);
            if (ws.readyState === 1) {
                ws.send(data);
            } else {
                ws.addEventListener('open', () => ws.send(data), { once: true });
            }
        }

        // Aplica bitrate, fps e redução de resolução no encoder daquele espectador.
        async function setSender(sender) {
            const params = sender.getParameters();
            if (!params.encodings?.length) {
                params.encodings = [{}];
            }
            const settings = sender.track.getSettings();
            const scale = Math.max(settings.width ? settings.width / width : 1, settings.height ? settings.height / height : 1, 1);
            params.encodings[0].minBitrate = bitrate;
            params.encodings[0].maxBitrate = bitrate;
            params.encodings[0].maxFramerate = fps;
            params.encodings[0].scaleResolutionDownBy = scale;
            await sender.setParameters(params);
        }

        // Copia resolução, fps e bitrate dos selects para as variáveis.
        function readQuality() {
            const size = document.getElementById('res').value.split('x');
            width = Number(size[0]);
            height = Number(size[1]);
            fps = Number(document.getElementById('fps').value);
            bitrate = Number(document.getElementById('rate').value);
        }

        // Pede a nova qualidade à faixa de vídeo e repete isso em cada conexão já aberta.
        async function pushQuality() {
            if (!stream) {
                return;
            }
            const track = stream.getVideoTracks()[0];
            if (track) {
                try {
                    await track.applyConstraints({
                        frameRate: { ideal: fps, max: fps },
                        height: { ideal: height, max: height },
                        width: { ideal: width, max: width },
                    });
                } catch { }
            }
            if (!stream) {
                return;
            }
            for (const pc of pcs.values()) {
                for (const sender of pc.getSenders()) {
                    if (sender.track?.kind !== 'video') {
                        continue;
                    }
                    try {
                        await setSender(sender);
                    } catch (err) {
                        showError(err);
                    }
                }
            }
        }

        // Mudanças de qualidade entram numa fila para não se atropelarem.
        let qualityChain = Promise.resolve();
        function onQualityChange() {
            readQuality();
            qualityChain = qualityChain.then(() => pushQuality()).catch((err) => showError(err));
        }

        // Abre a conexão WebRTC com um espectador e manda a oferta SDP.
        async function connectViewer(id) {
            const pc = new RTCPeerConnection({ iceServers });
            pcs.set(id, pc);
            ice.set(id, []);
            const sender = pc.addTrack(stream.getVideoTracks()[0], stream);
            const audio = stream.getAudioTracks()[0];
            if (audio) {
                pc.addTrack(audio, stream);
            }
            // Cada candidato ICE encontrado é encaminhado ao espectador pelo servidor.
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    send({ candidate: e.candidate, id, type: 'candidate' });
                }
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            try {
                await setSender(sender);
            } catch (err) {
                showError(err);
            }
            send({ id, sdp: pc.localDescription, type: 'offer' });
        }

        // Trata uma mensagem de sinalização vinda do servidor.
        async function handle(msg) {
            // Servidor recusou o nome vazio.
            if (msg.type === 'need-name') {
                stop();
                showError('Nome de transmissão é obrigatório');
                return;
            }
            // Um espectador entrou: cria a oferta para ele.
            if (msg.type === 'watcher' && stream) {
                await connectViewer(msg.id);
                return;
            }
            // Resposta SDP do espectador. Candidatos guardados antes dela entram agora.
            if (msg.type === 'answer') {
                const pc = pcs.get(msg.id);
                if (!pc) {
                    return;
                }
                await pc.setRemoteDescription(msg.sdp);
                for (const c of ice.get(msg.id) || []) {
                    await pc.addIceCandidate(c);
                }
                ice.set(msg.id, []);
                return;
            }
            // Candidato ICE do espectador. Sem a resposta SDP ainda, fica na fila.
            if (msg.type === 'candidate') {
                const pc = pcs.get(msg.id);
                if (!pc?.remoteDescription) {
                    if (!ice.has(msg.id)) {
                        ice.set(msg.id, []);
                    }
                    ice.get(msg.id).push(msg.candidate);
                    return;
                }
                await pc.addIceCandidate(msg.candidate);
                return;
            }
            // Espectador saiu: fecha só a conexão dele.
            if (msg.type === 'watcher-gone') {
                const pc = pcs.get(msg.id);
                if (pc) {
                    pc.close();
                }
                pcs.delete(msg.id);
                ice.delete(msg.id);
            }
        }

        // Mensagens do socket são processadas uma depois da outra.
        let chain = Promise.resolve();
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            chain = chain.then(() => handle(msg)).catch((err) => showError(err));
        };

        const go = document.getElementById('go');
        const nameInput = document.getElementById('name');
        const preview = document.getElementById('preview');

        // A imagem tem id="vdz", então no navegador window.vdz é essa imagem.
        // Só a ponte do Electron tem choose e windows.
        function desktop() {
            const api = window.vdz;
            if (!api || typeof api.choose !== 'function' || typeof api.windows !== 'function') {
                return null;
            }
            return api;
        }

        // Impede um segundo clique enquanto a captura ainda não terminou.
        let starting = false;
        // Função que desliga o áudio extra do app Electron, quando ele existe.
        let audioPump = null;

        // Mostra a prévia local, sem som (o <video> está muted).
        function showPreview() {
            preview.srcObject = stream;
            preview.hidden = false;
            preview.classList.add('on');
            preview.play().catch(() => { });
        }

        function hidePreview() {
            preview.classList.remove('on');
            preview.hidden = true;
            preview.pause();
            preview.srcObject = null;
        }

        // Para a captura de áudio da janela no Electron e esquece o callback.
        function releaseAudio() {
            if (!audioPump) {
                return;
            }
            const release = audioPump;
            audioPump = null;
            release();
        }

        // O app manda amostras num formato ou noutro; o AudioContext precisa de Float32Array.
        function asFloat(samples) {
            if (samples instanceof Float32Array) {
                return samples;
            }
            return Float32Array.from(samples);
        }

        // No Electron, o áudio da janela chega em pedaços PCM e vira uma faixa de MediaStream.
        async function startWindowAudio() {
            const chunks = [];
            let offset = 0;
            let channels = 2;
            // Guarda os pedaços e descarta o que passar de cerca de 1 segundo, para não atrasar.
            desktop().onAudio((payload) => {
                channels = payload.channels || channels;
                chunks.push(asFloat(payload.samples));
                let total = 0;
                for (const item of chunks) {
                    total += item.length;
                }
                while (chunks.length > 1 && total > 48000 * channels) {
                    total -= chunks[0].length;
                    chunks.shift();
                    offset = 0;
                }
            });
            const meta = await desktop().startAudio();
            if (!meta) {
                desktop().offAudio();
                throw new Error('audio');
            }
            const ctx = new AudioContext({ sampleRate: meta.sampleRate || 48000 });
            await ctx.resume();
            // dest é o stream enviado aos espectadores. mute liga o processador sem tocar o áudio aqui.
            const dest = ctx.createMediaStreamDestination();
            const node = ctx.createScriptProcessor(4096, 0, 2);
            const mute = ctx.createGain();
            mute.gain.value = 0;
            // Copia o buffer para estéreo. Mono é duplicado; se faltar amostra, sai silêncio.
            node.onaudioprocess = (ev) => {
                const left = ev.outputBuffer.getChannelData(0);
                const right = ev.outputBuffer.getChannelData(1);
                for (let i = 0; i < left.length; i++) {
                    if (!chunks.length || offset >= chunks[0].length) {
                        if (chunks.length) {
                            chunks.shift();
                            offset = 0;
                        }
                        if (!chunks.length) {
                            left[i] = 0;
                            right[i] = 0;
                            continue;
                        }
                    }
                    const data = chunks[0];
                    if (channels < 2) {
                        const sample = data[offset++];
                        left[i] = sample;
                        right[i] = sample;
                        continue;
                    }
                    if (offset + 1 >= data.length) {
                        chunks.shift();
                        offset = 0;
                        i -= 1;
                        continue;
                    }
                    left[i] = data[offset++];
                    right[i] = data[offset++];
                }
            };
            node.connect(dest);
            node.connect(mute);
            mute.connect(ctx.destination);
            return {
                stop() {
                    desktop().offAudio();
                    desktop().stopAudio();
                    node.disconnect();
                    mute.disconnect();
                    ctx.close();
                },
                stream: dest.stream,
            };
        }

        // Pede a tela ao navegador. No Electron, a janela vem da lista e o áudio vem à parte.
        async function capture() {
            const api = desktop();
            if (!api) {
                return navigator.mediaDevices.getDisplayMedia({
                    audio: true,
                    video: { frameRate: { ideal: fps, max: fps }, height: { ideal: height }, width: { ideal: width } },
                });
            }
            const id = document.getElementById('win').value;
            if (!id) {
                throw new Error('janela');
            }
            const picked = await api.choose(id);
            if (!picked) {
                throw new Error('janela');
            }
            const videoStream = await navigator.mediaDevices.getDisplayMedia({ audio: false, video: true });
            try {
                const extra = await startWindowAudio();
                audioPump = () => extra.stop();
                return new MediaStream([...videoStream.getVideoTracks(), ...extra.stream.getAudioTracks()]);
            } catch (err) {
                releaseAudio();
                for (const track of videoStream.getTracks()) {
                    track.stop();
                }
                throw err;
            }
        }

        // Encerra a transmissão: para faixas, fecha os espectadores e avisa o servidor.
        function stop() {
            stayAwake(false);
            hidePreview();
            releaseAudio();
            nameInput.disabled = false;
            if (!stream) {
                return;
            }
            const current = stream;
            stream = null;
            for (const track of current.getTracks()) {
                track.onended = null;
                track.stop();
            }
            for (const pc of pcs.values()) {
                pc.close();
            }
            pcs.clear();
            ice.clear();
            go.classList.remove('stop');
            send({ type: 'stop' });
        }

        // O mesmo botão começa e para. Começar captura a tela e se registra como broadcaster.
        go.onclick = async () => {
            if (stream) {
                stop();
                return;
            }
            if (starting) {
                return;
            }
            const name = nameInput.value.trim();
            if (!name) {
                showError('Nome de transmissão é obrigatório');
                return;
            }
            starting = true;
            readQuality();
            try {
                stream = await capture();
            } catch (err) {
                if (err?.message === 'janela') {
                    showError('Escolha a janela');
                } else if (err?.message === 'audio') {
                    showError('Sem áudio da janela');
                }
                return;
            } finally {
                starting = false;
            }
            // Parar o compartilhamento no navegador também encerra a transmissão.
            const track = stream.getVideoTracks()[0];
            track.onended = () => stop();
            showPreview();
            qualityChain = qualityChain.then(() => pushQuality()).catch((err) => showError(err));
            await qualityChain;
            if (!stream) {
                return;
            }
            go.classList.add('stop');
            nameInput.disabled = true;
            send({ name, type: 'broadcaster' });
            stayAwake(true);
        };

        document.getElementById('res').addEventListener('change', onQualityChange);
        document.getElementById('fps').addEventListener('change', onQualityChange);
        document.getElementById('rate').addEventListener('change', onQualityChange);

        // No Electron, a lista de janelas aparece e é atualizada cada vez que o select ganha foco.
        const winRow = document.getElementById('win-row');
        const winSelect = document.getElementById('win');
        if (desktop()) {
            const refresh = () => {
                const current = winSelect.value;
                desktop()
                    .windows()
                    .then((list) => {
                        winSelect.replaceChildren();
                        const blank = document.createElement('option');
                        blank.value = '';
                        blank.textContent = 'Selecione a janela...';
                        winSelect.append(blank);
                        for (const item of list) {
                            const option = document.createElement('option');
                            option.value = item.id;
                            option.textContent = item.name;
                            winSelect.append(option);
                        }
                        // Mantém a janela já escolhida se ela ainda existir na lista nova.
                        if ([...winSelect.options].some((option) => option.value === current)) {
                            winSelect.value = current;
                        }
                        winRow.hidden = false;
                    })
                    .catch((err) => showError(err));
            };
            winSelect.addEventListener('focus', refresh);
            refresh();
        }
    </script>
</body>

</html>
