<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>stream</title>
</head>

<body>
    <select id="res">
        <option value="427x240">240p</option>
        <option value="854x480">480p</option>
        <option value="1280x720">720p</option>
        <option value="1920x1080">1080p</option>
    </select>
    <select id="fps">
        <option value="30">30 fps</option>
        <option value="60">60 fps</option>
    </select>
    <button id="go" type="button">stream</button>
    <script>
        const MIN_BITRATE = 4_000_000;
        const MAX_BITRATE = 40_000_000;
        const pcs = new Map();
        const ice = new Map();
        let stream = null;
        let width = 1280;
        let height = 720;
        let fps = 30;

        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

        function send(msg) {
            const data = JSON.stringify(msg);
            if (ws.readyState === 1) {
                ws.send(data);
            } else {
                ws.addEventListener('open', () => ws.send(data), { once: true });
            }
        }

        async function setSender(sender) {
            const params = sender.getParameters();
            if (!params.encodings?.length) {
                params.encodings = [{}];
            }
            const settings = sender.track.getSettings();
            const scale = Math.max(settings.width ? settings.width / width : 1, settings.height ? settings.height / height : 1);
            params.encodings[0].minBitrate = MIN_BITRATE;
            params.encodings[0].maxBitrate = MAX_BITRATE;
            params.encodings[0].maxFramerate = fps;
            if (scale > 1) {
                params.encodings[0].scaleResolutionDownBy = scale;
            }
            await sender.setParameters(params);
        }

        async function connectViewer(id) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pcs.set(id, pc);
            ice.set(id, []);
            const sender = pc.addTrack(stream.getVideoTracks()[0], stream);
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    send({ candidate: e.candidate, id, type: 'candidate' });
                }
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            try {
                await setSender(sender);
            } catch (err) {
                console.error(err);
            }
            send({ id, sdp: pc.localDescription, type: 'offer' });
        }

        async function handle(msg) {
            if (msg.type === 'watcher' && stream) {
                await connectViewer(msg.id);
                return;
            }
            if (msg.type === 'answer') {
                const pc = pcs.get(msg.id);
                if (!pc) {
                    return;
                }
                await pc.setRemoteDescription(msg.sdp);
                for (const c of ice.get(msg.id) || []) {
                    await pc.addIceCandidate(c);
                }
                ice.set(msg.id, []);
                return;
            }
            if (msg.type === 'candidate') {
                const pc = pcs.get(msg.id);
                if (!pc?.remoteDescription) {
                    if (!ice.has(msg.id)) {
                        ice.set(msg.id, []);
                    }
                    ice.get(msg.id).push(msg.candidate);
                    return;
                }
                await pc.addIceCandidate(msg.candidate);
                return;
            }
            if (msg.type === 'watcher-gone') {
                const pc = pcs.get(msg.id);
                if (pc) {
                    pc.close();
                }
                pcs.delete(msg.id);
                ice.delete(msg.id);
            }
        }

        let chain = Promise.resolve();
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            chain = chain.then(() => handle(msg)).catch((err) => console.error(err));
        };

        const go = document.getElementById('go');
        let starting = false;

        function stop() {
            if (!stream) {
                return;
            }
            const current = stream;
            stream = null;
            for (const track of current.getTracks()) {
                track.onended = null;
                track.stop();
            }
            for (const pc of pcs.values()) {
                pc.close();
            }
            pcs.clear();
            ice.clear();
            go.textContent = 'stream';
            send({ type: 'stop' });
        }

        go.onclick = async () => {
            if (stream) {
                stop();
                return;
            }
            if (starting) {
                return;
            }
            starting = true;
            const size = document.getElementById('res').value.split('x');
            width = Number(size[0]);
            height = Number(size[1]);
            fps = Number(document.getElementById('fps').value);
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    audio: false,
                    video: { frameRate: { ideal: fps, max: fps }, height: { ideal: height }, width: { ideal: width } },
                });
            } catch {
                return;
            } finally {
                starting = false;
            }
            const track = stream.getVideoTracks()[0];
            try {
                await track.applyConstraints({ frameRate: { ideal: fps, max: fps } });
            } catch { }
            if (!stream) {
                return;
            }
            track.onended = () => stop();
            go.textContent = 'stop';
            send({ type: 'broadcaster' });
        };
    </script>
</body>

</html>
