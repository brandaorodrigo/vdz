<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>assistir</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>
    <video autoplay id="v" playsinline>
        <track kind="captions" label="legendas" src="data:text/vtt,WEBVTT" srclang="pt">
    </video>
    <script>
        const ICE_SERVERS = [
            'stun:stun.l.google.com:19302',
            'stun:stun1.l.google.com:19302',
            'stun:stun2.l.google.com:19302',
            'stun:stun3.l.google.com:19302',
            'stun:stun4.l.google.com:19302',
            'stun:stun.services.mozilla.com',
            'stun:stun.stunprotocol.org:3478',
        ];
        const v = document.getElementById('v');
        let pc = null;
        const pending = [];

        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

        function peer() {
            if (pc) {
                pc.close();
            }
            pc = new RTCPeerConnection({ iceServers: [{ urls: ICE_SERVERS }] });
            pc.ontrack = (e) => {
                v.srcObject = e.streams[0];
                v.play().catch(() => { });
            };
            pc.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === 1) {
                    ws.send(JSON.stringify({ candidate: e.candidate, type: 'candidate' }));
                }
            };
            return pc;
        }

        async function handle(msg) {
            if (msg.type === 'offer') {
                const early = pending.splice(0);
                const conn = peer();
                await conn.setRemoteDescription(msg.sdp);
                const answer = await conn.createAnswer();
                await conn.setLocalDescription(answer);
                ws.send(JSON.stringify({ sdp: conn.localDescription, type: 'answer' }));
                for (const c of early) {
                    await conn.addIceCandidate(c);
                }
                return;
            }
            if (msg.type === 'candidate') {
                if (pc?.remoteDescription) {
                    await pc.addIceCandidate(msg.candidate);
                } else {
                    pending.push(msg.candidate);
                }
                return;
            }
            if (msg.type === 'stop') {
                if (pc) {
                    pc.close();
                }
                pc = null;
                v.srcObject = null;
            }
        }

        let chain = Promise.resolve();
        ws.onopen = () => ws.send(JSON.stringify({ type: 'watcher' }));
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            chain = chain.then(() => handle(msg)).catch((err) => console.error(err));
        };
    </script>
</body>

</html>
